server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product REST v1 preserves /api/v1 on the upstream because the server contract owns that prefix.
    location /api/v1/ {
        proxy_pass http://api:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Existing infrastructure probes can continue using /api/<health-path> with the legacy prefix strip.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /otel/ {
        proxy_pass http://otel-collector:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
