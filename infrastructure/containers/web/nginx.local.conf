server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El Compose local cifra el salto de mismo origen para que Kestrel pueda
    # mantener las cookies antifalsificacion y de sesion siempre Secure.
    # X-Musica-Client-Address se sobrescribe en el proxy; la API solo lo
    # confía cuando Security:LoginAbuse:TrustClientAddressHeader=true.
    location /api/v1/ {
        proxy_pass https://api:8443/api/v1/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Musica-Client-Address $remote_addr;
    }

    location /api/ {
        proxy_pass https://api:8443/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Musica-Client-Address $remote_addr;
    }

    location /health/ {
        proxy_pass https://api:8443/health/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }

    location /otel/ {
        proxy_pass http://otel-collector:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
