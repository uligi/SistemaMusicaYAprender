name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  verify:
    name: Quality, tests and least-privilege database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: musica_aprender_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d musica_aprender_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tracked tree contains no secrets
        shell: bash
        run: bash scripts/security/check-no-secrets.sh

      - name: Verify authoritative physical SQL
        shell: bash
        run: bash scripts/ci/database/verify-master-source.sh

      - name: Prepare ephemeral Compose secrets
        shell: bash
        run: bash scripts/ci/security/create-compose-secrets.sh

      - name: Validate local Docker Compose definition
        shell: bash
        run: docker compose config --quiet

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare evidence folders
        shell: bash
        run: |
          mkdir -p artifacts/ci
          mkdir -p artifacts/test-results
          mkdir -p artifacts/postgres

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply PostgreSQL roles and extensions bootstrap
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/database/apply-bootstrap.sh

      - name: Apply separated PostgreSQL LOGIN identities
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/database/apply-login-identities.sh

      - name: Verify PostgreSQL bootstrap and idempotency
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/database/verify-bootstrap.sh

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore .NET packages in locked mode
        run: dotnet restore MusicaAprender.sln --locked-mode

      - name: Restore frontend packages from lockfile
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Verify versioned visual tokens
        run: node scripts/frontend/verify-design-tokens.mjs

      - name: Verify accessible essential components
        run: node scripts/frontend/verify-accessible-components.mjs

      - name: Verify app shell and route boundaries
        run: node scripts/frontend/verify-app-shell.mjs

      - name: Verify typed HTTP client and ProblemDetails
        run: node scripts/frontend/verify-http-client.mjs

      - name: Verify Playwright, axe and visual test harness
        run: node scripts/frontend/verify-e2e-harness.mjs

      - name: TypeScript strict check for E2E harness
        run: npm run typecheck:e2e

      - name: Formatting check
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E accessibility and visual evidence
        run: npm run test:e2e

      - name: Verify .NET formatting and analyzers
        run: dotnet format MusicaAprender.sln --verify-no-changes --no-restore

      - name: Build .NET solution
        run: dotnet build MusicaAprender.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test
          tests/UnitTests/MusicaAprender.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results

      - name: Run architecture tests
        run: >
          dotnet run
          --project tests/ArchitectureTests/MusicaAprender.ArchitectureTests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Verify module boundaries
        shell: bash
        run: bash scripts/check-module-boundaries.sh

      - name: Verify repository governance templates
        shell: bash
        run: bash scripts/governance/check-templates.sh

      - name: Verify embedded migration with separated migrator
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/database/verify-empty-migration.sh

      - name: Verify separated database identities and least privilege
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/database/verify-database-access.sh

      - name: Verify transaction-local RLS context and pool cleanup
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/database/verify-transaction-context.sh

      - name: Verify schema-owned EF Core models
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/database/verify-ef-model.sh

      - name: Verify minimum effective configuration publication
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/configuration/verify-minimum-effective-configuration.sh

      - name: Verify transactional outbox, inbox and idempotency
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/database/verify-reliability.sh

      - name: Verify password policy, Argon2id credential and versioned registration
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/identity/verify-personal-registration.sh

      - name: Verify one-use account verification and non-enumerable resend
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/identity/verify-account-verification.sh

      - name: Verify same-origin login, CSRF and revocable server session
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/identity/verify-personal-login.sh

      - name: Verify logout revokes only the current server session
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/identity/verify-personal-logout.sh

      - name: Verify login abuse limits and session bounds
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/identity/verify-login-abuse.sh

      - name: Verify effective permissions, scope and current validity
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL030_USE_DOCKER_PSQL: 'false'
          BL030_API_URL: https://localhost:5446
        run: bash scripts/ci/security/verify-effective-authorization.sh

      - name: Start private development object store
        shell: bash
        run: |
          docker compose up --detach object-store
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs object-store
          exit 1

      - name: Verify audited role assignment administration
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL031_USE_DOCKER_PSQL: 'false'
          BL031_API_URL: https://localhost:5447
        run: bash scripts/ci/security/verify-role-assignments.sh

      - name: Verify privileged MFA and recent reauthentication
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL032_USE_DOCKER_PSQL: 'false'
          BL032_API_URL: https://localhost:5448
        run: bash scripts/ci/security/verify-privileged-mfa.sh

      - name: Verify primary security and audit events
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL033_USE_DOCKER_PSQL: 'false'
          BL033_API_URL: https://localhost:5449
        run: bash scripts/ci/security/verify-primary-audit.sh

      - name: Verify basic profile and safe personal preferences
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL034_USE_DOCKER_PSQL: 'false'
          BL034_API_URL: https://localhost:5450
        run: bash scripts/ci/identity/verify-personal-preferences.sh

      - name: Verify versioned catalog and parameter administration
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL036_USE_DOCKER_PSQL: 'false'
          BL036_API_URL: https://localhost:5451
        run: bash scripts/ci/configuration/verify-versioned-configuration-administration.sh

      - name: Verify stable artist identities, aliases and duplicate warning
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL037_USE_DOCKER_PSQL: 'false'
          BL037_API_URL: https://localhost:5452
        run: bash scripts/ci/catalog/verify-artist-administration.sh

      - name: Verify work, recording and exact YouTube source administration
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL038_USE_DOCKER_PSQL: 'false'
          BL038_API_URL: https://localhost:5453
        run: bash scripts/ci/catalog/verify-song-draft-administration.sh

      - name: Verify credit participant provenance administration
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL039_USE_DOCKER_PSQL: 'false'
          BL039_API_URL: https://localhost:5454
        run: bash scripts/ci/catalog/verify-credit-provenance-administration.sh

      - name: Verify rights, uses, territories and validity administration
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL040_USE_DOCKER_PSQL: 'false'
          BL040_API_URL: https://localhost:5455
        run: bash scripts/ci/editorial/verify-rights-administration.sh

      - name: Verify eligible and rebuildable public catalog projection
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL041_USE_DOCKER_PSQL: 'false'
          BL041_API_URL: https://localhost:5456
        run: bash scripts/ci/catalog/verify-public-catalog-projection.sh

      - name: Verify internal PostgreSQL public catalog search
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL042_USE_DOCKER_PSQL: 'false'
          BL042_API_URL: https://localhost:5457
        run: bash scripts/ci/catalog/verify-public-catalog-search.sh

      - name: Verify public song detail by readable slug
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL043_USE_DOCKER_PSQL: 'false'
          BL043_API_URL: https://localhost:5458
        run: bash scripts/ci/catalog/verify-public-song-detail.sh

      - name: Verify capability-filtered editorial inbox
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL044_USE_DOCKER_PSQL: 'false'
        run: bash scripts/ci/editorial/verify-editorial-inbox.sh

      - name: Verify new-song editorial assistant
        shell: bash
        run: bash scripts/ci/editorial/verify-new-song-assistant.sh

      - name: Verify song editorial dossier
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL046_USE_DOCKER_PSQL: 'false'
        run: bash scripts/ci/editorial/verify-song-editorial-dossier.sh

      - name: Verify editorial autosave and conflicts
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL052_USE_DOCKER_PSQL: 'false'
        run: bash scripts/ci/editorial/verify-editorial-autosave-conflicts.sh

      - name: Verify lyrics revision structure
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL053_USE_DOCKER_PSQL: 'false'
        run: bash scripts/ci/content/verify-lyrics-structure-model.sh

      - name: Verify structured Japanese lyrics editor
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL054_USE_DOCKER_PSQL: 'false'
        run: bash scripts/ci/content/verify-lyrics-structured-editor.sh

      - name: Verify manual lyrics token segmentation
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: musica_aprender_ci
          BL055_USE_DOCKER_PSQL: 'false'
        run: bash scripts/ci/content/verify-lyrics-token-segmentation.sh

      - name: Verify encrypted private object storage
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/object-storage/verify-private-object-store.sh

      - name: Verify queued versioned SMTP email delivery
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: musica_aprender_ci
        run: bash scripts/ci/email/verify-email-delivery.sh

      - name: Verify tracked tree still contains no secrets
        shell: bash
        run: bash scripts/security/check-no-secrets.sh

      - name: Write evidence manifest
        if: always()
        shell: bash
        run: bash scripts/ci/evidence/write-manifest.sh

      - name: Publish CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/
            apps/web/dist/
          if-no-files-found: warn
          retention-days: 14
