name: musica-aprender-local

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/containers/web/Dockerfile
    image: musica-aprender/web:local
    volumes:
      - ./infrastructure/containers/web/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${WEB_PORT:-5173}:8080'
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - musica-aprender

  api:
    build:
      context: .
      dockerfile: infrastructure/containers/api/Dockerfile
    image: musica-aprender/api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      Kestrel__Certificates__Default__Path: /run/secrets/aspnetcore_local_https_certificate
      Kestrel__Certificates__Default__KeyPath: /run/secrets/aspnetcore_local_https_key
      Database__Host: postgres
      Database__Port: '5432'
      Database__Name: ${POSTGRES_DB:-musica_aprender}
      Database__Username: jp_login_api
      Database__PasswordSecret: postgres_api_password
      Secrets__Directory: /run/secrets
      Secrets__RequireExternal: 'true'
      ObjectStore__Endpoint: http://object-store:9000
      ObjectStore__Bucket: ${OBJECT_STORE_BUCKET:-musica-aprender-private}
      ObjectStore__EncryptionKeyReference: local-secret://object_store_encryption_key/v1
      Smtp__Host: smtp-sink
      Smtp__Port: '1025'
      Smtp__FromAddress: no-reply@musica-aprender.local
      Smtp__FromDisplayName: Musica y Aprender
      Smtp__Security: None
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
      Dependencies__ObjectStoreHealthUrl: http://object-store:9000/minio/health/ready
      Dependencies__SmtpHost: smtp-sink
      Dependencies__SmtpPort: '1025'
      Dependencies__OpenTelemetryHealthUrl: http://otel-collector:13133/
      Security__LoginAbuse__AccountFailureLimit: ${LOGIN_ABUSE_ACCOUNT_FAILURE_LIMIT:-5}
      Security__LoginAbuse__ClientFailureLimit: ${LOGIN_ABUSE_CLIENT_FAILURE_LIMIT:-20}
      Security__LoginAbuse__WindowSeconds: ${LOGIN_ABUSE_WINDOW_SECONDS:-900}
      Security__LoginAbuse__TrustClientAddressHeader: 'true'
    secrets:
      - postgres_api_password
      - object_store_access_key
      - object_store_secret_key
      - object_store_encryption_key
      - identity_email_lookup_key
      - identity_email_encryption_key
      - identity_verification_token_key
      - identity_password_fingerprint_key
      - identity_login_abuse_key
      - aspnetcore_local_https_certificate
      - aspnetcore_local_https_key
    ports:
      - '${API_PORT:-5080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_started
      smtp-sink:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
      - musica-aprender

  worker:
    build:
      context: .
      dockerfile: infrastructure/containers/worker/Dockerfile
    image: musica-aprender/worker:local
    environment:
      DOTNET_ENVIRONMENT: Development
      Database__Host: postgres
      Database__Port: '5432'
      Database__Name: ${POSTGRES_DB:-musica_aprender}
      Database__Username: jp_login_worker
      Database__PasswordSecret: postgres_worker_password
      Secrets__Directory: /run/secrets
      Secrets__RequireExternal: 'true'
      ObjectStore__Endpoint: http://object-store:9000
      ObjectStore__Bucket: ${OBJECT_STORE_BUCKET:-musica-aprender-private}
      ObjectStore__EncryptionKeyReference: local-secret://object_store_encryption_key/v1
      Smtp__Host: smtp-sink
      Smtp__Port: '1025'
      Smtp__FromAddress: no-reply@musica-aprender.local
      Smtp__FromDisplayName: Musica y Aprender
      Smtp__Security: None
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
    secrets:
      - postgres_worker_password
      - object_store_access_key
      - object_store_secret_key
      - object_store_encryption_key
      - identity_email_lookup_key
      - identity_email_encryption_key
      - identity_verification_token_key
      - identity_password_fingerprint_key
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_started
      smtp-sink:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
      - musica-aprender

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musica_aprender}
      POSTGRES_USER: ${POSTGRES_USER:-musica_local}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/postgresql/bootstrap/roles/00_bootstrap_roles_extensions.sql:/docker-entrypoint-initdb.d/00_bootstrap_roles_extensions.sql:ro
      - ./database/postgresql:/workspace/database/postgresql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-musica_local} -d ${POSTGRES_DB:-musica_aprender}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - musica-aprender

  object-store:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/object_store_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/object_store_secret_key
    secrets:
      - object_store_access_key
      - object_store_secret_key
    ports:
      - '${OBJECT_STORE_PORT:-9000}:9000'
      - '${OBJECT_STORE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - object-store-data:/data
    restart: unless-stopped
    networks:
      - musica-aprender

  smtp-sink:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_MAX_MESSAGES: '500'
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${SMTP_UI_PORT:-8025}:8025'
    volumes:
      - smtp-data:/data
    restart: unless-stopped
    networks:
      - musica-aprender

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./infrastructure/containers/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '${OTEL_GRPC_PORT:-4317}:4317'
      - '${OTEL_HTTP_PORT:-4318}:4318'
      - '${OTEL_HEALTH_PORT:-13133}:13133'
    restart: unless-stopped
    networks:
      - musica-aprender

networks:
  musica-aprender:
    name: musica-aprender-local

volumes:
  postgres-data:
  object-store-data:
  smtp-data:

secrets:
  postgres_password:
    file: ./secrets/local/postgres_password
  postgres_migrator_password:
    file: ./secrets/local/postgres_migrator_password
  postgres_api_password:
    file: ./secrets/local/postgres_api_password
  postgres_backoffice_password:
    file: ./secrets/local/postgres_backoffice_password
  postgres_worker_password:
    file: ./secrets/local/postgres_worker_password
  postgres_readonly_password:
    file: ./secrets/local/postgres_readonly_password
  object_store_access_key:
    file: ./secrets/local/object_store_access_key
  object_store_secret_key:
    file: ./secrets/local/object_store_secret_key
  object_store_encryption_key:
    file: ./secrets/local/object_store_encryption_key
  identity_email_lookup_key:
    file: ./secrets/local/identity_email_lookup_key
  identity_email_encryption_key:
    file: ./secrets/local/identity_email_encryption_key
  identity_verification_token_key:
    file: ./secrets/local/identity_verification_token_key
  identity_password_fingerprint_key:
    file: ./secrets/local/identity_password_fingerprint_key
  identity_login_abuse_key:
    file: ./secrets/local/identity_login_abuse_key
  aspnetcore_local_https_certificate:
    file: ./secrets/local/aspnetcore_local_https.pem
  aspnetcore_local_https_key:
    file: ./secrets/local/aspnetcore_local_https.key
